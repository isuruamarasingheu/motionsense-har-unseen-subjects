# Configuration for PyTorch MLP (Task T3b)
model:
  name: "pytorch_mlp"
  input_dim: 84
  hidden_sizes: [128, 64]
  dropout: 0.2
  num_classes: 6

training:
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 60
  patience: 8
  loss: "cross_entropy"
  use_class_weights: false

seeds: [0, 1, 2]

