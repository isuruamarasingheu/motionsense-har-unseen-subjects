# Configuration for NumPy 1-hidden-layer MLP from first principles (Task T2)
model:
  name: "numpy_mlp"
  n_in: 84
  n_hidden: 32
  n_out: 6
  activation: "tanh"

training:
  batch_size: 64
  learning_rate: 0.05
  max_epochs: 200
  patience: 15
  train_subset_size: 3000
  seed: 42

gradient_check:
  epsilon: 0.00001
  tolerance: 0.000001
  batch_size: 8

